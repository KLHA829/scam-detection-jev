name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ci-static-gates.js

  test:
    runs-on: ubuntu-latest
    env:
      # Tests do not launch Chrome. Skip Puppeteer's browser download.
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: node scripts/review-eval.js --llm dry --mode all

  verify-smoke-ubuntu:
    runs-on: ubuntu-latest
    needs: static-gates
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: verify-scam-bot smoke drives
        run: bash scripts/ci-verify-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-smoke-evidence-ubuntu
          path: .cursor/skills/verify-scam-bot/evidence/
          if-no-files-found: ignore

  verify-smoke-windows:
    runs-on: windows-latest
    needs: static-gates
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - name: verify-scam-bot smoke drives (Git Bash + Win32 doctor spawn)
        shell: bash
        run: bash scripts/ci-verify-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-smoke-evidence-windows
          path: .cursor/skills/verify-scam-bot/evidence/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: python -m pip install ruff==0.17.6
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - run: npm run test:e2e:mini-wa

  wa-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wa-bridge/go.mod
          cache-dependency-path: wa-bridge/go.sum
      - name: vet, test, and pure-Go build wa-bridge
        working-directory: wa-bridge
        run: |
          go vet ./...
          go test -race ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/wa-bridge-ci .

  e2e-whatsapp-boot:
    runs-on: ubuntu-latest
    # WhatsApp Web may be unreachable from the runner; this boot smoke is best-effort.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - id: boot
        continue-on-error: true
        run: npm run test:e2e:boot
      - if: steps.boot.outcome == 'failure'
        run: echo "::warning::e2e-whatsapp-boot failed (best-effort live WhatsApp Web check); see previous step logs."

  e2e-whatsmeow-boot:
    runs-on: ubuntu-latest
    # WhatsApp servers may be unreachable from the runner; this Chromium-free boot smoke is best-effort.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: wa-bridge/go.mod
          cache-dependency-path: wa-bridge/go.sum
      - run: npm ci
      - id: boot
        continue-on-error: true
        run: npm run test:e2e:boot:whatsmeow
      - if: steps.boot.outcome == 'failure'
        run: echo "::warning::e2e-whatsmeow-boot failed (best-effort live WhatsApp check); see previous step logs."
