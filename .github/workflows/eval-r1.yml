# Full jevlike r1 re-score (torch + HF encoder). Too heavy for every PR; run manually.
name: eval-r1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -r requirements.txt
      - run: bash scripts/download_jevlike_ckpt.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run eval:hk -- --json
